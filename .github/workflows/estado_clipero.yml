# Diagnóstico del Clipero (sin claves). Se activa con pedir/cl-*.txt
name: Estado Clipero
on:
  push:
    branches: [encargos]
    paths: ["pedir/cl-*.txt"]
permissions:
  contents: write
jobs:
  estado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preguntar al servidor
        run: |
          mkdir -p estado
          curl -sf --max-time 90 "http://173.249.44.95/estado/clipero.json" -o estado/clipero.json || echo '{"error": "servidor sin respuesta"}' > estado/clipero.json
          cat estado/clipero.json
          curl -sf --max-time 120 "http://173.249.44.95/estado/ytstats.json" -o estado/ytstats.json || echo '{"error": "sin respuesta"}' > estado/ytstats.json
          git rm -q pedir/cl-*.txt || true
      - name: Guardar
        run: |
          git config user.name "encargos-bot"
          git config user.email "encargos-bot@users.noreply.github.com"
          git add -A estado pedir || true
          git commit -qm "Estado del Clipero" || exit 0
          git pull -q --rebase || true
          git push
